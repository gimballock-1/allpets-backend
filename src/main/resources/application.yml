spring:
  application:
    name: allpets-api

  # appdb (owner role app_svc). Creds come from the k8s Secret at runtime — never here.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:app_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}   # single-replica clinic volume
      pool-name: appdb-pool

  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never Hibernate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true                 # versioned SQL under classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Deliberately NOT `framework` (14.2): Spring's ForwardedHeaderFilter trusts the
  # LEFT-most X-Forwarded-For entry (client-spoofable) and strips the header before
  # controllers see it. Client-IP resolution is done explicitly in ClientIpResolver
  # (right-most non-trusted XFF entry against allpets.http.trusted-proxy-cidrs below).
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        # Health + Prometheus scrape + build/version info. Nothing else exposed.
        include: health,info,prometheus
      # No consumer walks the /actuator HAL links page (probes hit /health directly,
      # Prometheus scrapes /prometheus directly) — and with forward-headers-strategy=none
      # (see `server:` above) its self-links would advertise http:// behind the
      # TLS-terminating proxy. Off rather than misleading.
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness + /actuator/health/readiness
      show-details: never      # no internals leaked on the public health endpoint
      group:
        readiness:
          # Readiness flips UP only when appdb is reachable (LLD §4) — the rollout gate.
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true            # surface the info.* block below
  metrics:
    tags:
      application: ${spring.application.name}

# Build traceability — populated at deploy time (CD passes GIT_SHA / BUILD_TIME).
info:
  app:
    name: ${spring.application.name}
  git:
    sha: ${GIT_SHA:dev}
  build:
    time: ${BUILD_TIME:unknown}

logging:
  level:
    root: INFO
    com.allpets.api: INFO

# allpets application config.
allpets:
  http:
    # Source ranges a REAL proxy hop occupies (14.2) — deliberately minimal: an
    # X-Forwarded-For entry inside these is a proxy hop to skip, and XFF is honoured at all
    # only when the TCP peer itself is in this set. Verified against quasar 2026-08-23:
    #   10.42.0.0/16    k3s pod CIDR (Traefik + the site proxy are pods; the node's actual
    #                   range is 10.42.0.0/24, /16 is the k3s cluster default)
    #   10.0.10.113/32  the node's exact LAN address (hairpin/SNAT egress)
    #   100.108.60.90/32 the node's exact Tailscale address (NOT all of 100.64.0.0/10 —
    #                   any other tailnet device is an ordinary client)
    #   loopback        unreachable from any network; port-forward/local dev
    # Broad ranges (blanket RFC1918/CGNAT/ULA) are deliberately NOT here: LAN/Tailscale/
    # tunnel traffic must bucket as itself, not have its spoofable XFF honoured.
    # Comma-separated; this env var is the escape hatch if cluster addresses change.
    #
    # RESIDUAL SEMANTICS (PR #218): the site's /api proxy reaches Spring over the
    # in-cluster Service URL (peer = site pod in 10.42/16, XFF = real client), so proxied
    # visitors each resolve to their own IP. DIRECT traffic to the public
    # api-allpets host still traverses Cloudflare (orange-cloud) -> Traefik, whose
    # default config rewrites XFF to its connecting peer — such requests bucket per
    # CF-edge/router IP: a SHARED bucket, acceptable for spam control on a direct-bot
    # path (the site never uses it). Improvable later by trusting Cloudflare's
    # published ranges + honouring CF-Connecting-IP.
    trusted-proxy-cidrs: ${ALLPETS_TRUSTED_PROXY_CIDRS:10.42.0.0/16,10.0.10.113/32,100.108.60.90/32,127.0.0.1/32,::1/128}
  rate-limit:
    # Per-client limits on POST /contact (14.2) — both windows apply: a burst is capped at
    # per-minute, sustained abuse at per-hour; when both are saturated Retry-After reports
    # the later recovery. Enforced in ContactRateLimitInterceptor BEFORE body parsing, so
    # malformed/invalid/honeypot requests all consume budget. GET /reviews is deliberately
    # unthrottled (read-only cached data). max-tracked-ips bounds the limiter's LRU key map
    # (fail-open at the cap; watch the allpets.ratelimit.evictions counter). IPv6 clients
    # are keyed by their /ipv6-key-prefix network (default /64) so address rotation inside
    # one delegation shares a single budget.
    contact:
      per-minute: ${ALLPETS_CONTACT_RATE_PER_MINUTE:5}
      per-hour: ${ALLPETS_CONTACT_RATE_PER_HOUR:30}
      max-tracked-ips: ${ALLPETS_CONTACT_RATE_MAX_TRACKED_IPS:10000}
      ipv6-key-prefix: ${ALLPETS_CONTACT_RATE_IPV6_KEY_PREFIX:64}
  cors:
    # Origin allowlist for the public API host (20.4). The Next.js site's server-side
    # /api proxy origin; credentials are off. CORS is enforced in Spring (CorsConfig),
    # not at the ingress. Comma-separate for multiple origins.
    allowed-origins: ${ALLPETS_CORS_ALLOWED_ORIGINS:https://allpets.skpodduturi.dev}
  reviews:
    # Google Reviews cache (Epic 10). place-id is NON-secret (GOOGLE_PLACE_ID, 10.1);
    # api-key is a SECRET (GOOGLE_PLACES_API_KEY, 10.2). Both empty until provided -> the
    # scheduled refresh is a no-op and GET /reviews serves a typed-empty payload.
    place-id: ${GOOGLE_PLACE_ID:}
    api-key: ${GOOGLE_PLACES_API_KEY:}
    # Daily refresh (Place Details bills per call; ~30/month stays in the free tier).
    refresh-cron: ${REVIEWS_REFRESH_CRON:0 0 3 * * *}
    timezone: ${REVIEWS_TIMEZONE:America/Chicago}

---
# `migrate` profile — deploy-time migration gate (issue 15.9). The CD pipeline runs the
# app image as a one-shot Job with SPRING_PROFILES_ACTIVE=migrate BEFORE rolling the
# Deployment: Flyway migrates, JPA validate checks the schema, then MigrateRunner exits.
# No web server is needed for that, so disable it (faster start, no port bind). Flyway
# stays enabled here (it is the migrator); the running Deployment sets
# SPRING_FLYWAY_ENABLED=false so the Job is the single migration authority.
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
