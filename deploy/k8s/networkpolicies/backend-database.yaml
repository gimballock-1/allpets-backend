# allpets NetworkPolicies — backend + database namespaces (issue 2.6)
#
# CNI enforcement: CONFIRMED on. k3s runs with defaults (flannel + the embedded
# kube-router NetworkPolicy controller; no --disable-network-policy), so these
# policies are enforced, not decorative.
#
# Posture: default-deny INGRESS per namespace, then explicit allows. Egress is
# left OPEN on purpose (req §8.4 note in spec 2.6) so SMTP / Google APIs /
# Backblaze B2 / GHCR / CoreDNS keep working — we don't want a too-tight egress
# policy to break backups, OAuth, or email.
#
# LABEL CONTRACT (app epics MUST comply for these allows to take effect):
#   - every allpets workload pod carries `app.kubernetes.io/part-of: allpets`
#   - namespaces are selected by their built-in `kubernetes.io/metadata.name`
#   The cross-namespace allows below are namespace-scoped (not per-pod), which is
#   the right granularity until the app ports settle (5.13/6.3/11.x).
#
# REUSE NOTE: observability is the existing shared `observability` namespace
# (Prometheus/Alloy). It must be allowed to scrape allpets pods' /metrics, hence
# the allow-observability-scrape policy in every allpets namespace.

####################  allpets-backend  ####################
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: allpets-backend
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Existing shared Prometheus/Alloy (observability ns) may scrape allpets pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scrape
  namespace: allpets-backend
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
# HISTORY: 20.5 removed the pre-pivot `allow-from-frontend` policy because the site's
# /api proxy fetched the Spring API via its PUBLIC host through Traefik, and reserved
# this path: "re-add a SCOPED allow only if the /api proxy is ever re-pointed at an
# in-cluster Service URL instead of the public host."
#
# THAT CONDITION FIRED 2026-08-23 (14.2 rate limiting, backend PR #218 + the parallel
# frontend repoint): the public host is Cloudflare orange-cloud PROXIED, so the proxy's
# fetch travelled proxy-pod -> Cloudflare edge -> WAN -> Traefik, and default Traefik
# rewrites X-Forwarded-For to its connecting peer — every visitor collapsed into one
# shared Cloudflare-edge/router bucket, inverting the per-IP limiter. The /api proxy now
# targets http://allpets-api.allpets-backend.svc.cluster.local:8080 directly, so Spring
# sees peer = the site pod (10.42/16, trusted) and XFF = the real client IP.
# allow-frontend-to-api below is that reserved SCOPED allow: allpets-frontend namespace
# only, the Spring API pods only (NOT Cal.com/Plausible), port 8080 only, and the
# frontend side further pinned to pods carrying the label-contract `part-of: allpets`
# (verified on the live allpets-site pod). Direct/public API traffic still flows through
# allow-traefik-ingress below.
---
# Site /api proxy (allpets-frontend ns) -> Spring API pods on 8080 ONLY (14.2 / PR #218;
# see the history note above for why this exists and why it is this narrow).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  namespace: allpets-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: allpets-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: allpets-frontend
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: allpets
      ports:
        - { protocol: TCP, port: 8080 }  # Spring API container port (named `http`)
---
# Traefik (kube-system) -> backend services that ingress directly:
# api.allpets -> Spring API (8080), book.allpets -> Cal.com (3000),
# analytics.allpets -> Plausible (8000).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: allpets-backend
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: TCP, port: 8080 }  # Spring API (20.5)
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 8000 }

####################  allpets-database  ####################
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: allpets-database
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scrape
  namespace: allpets-database
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
---
# Payload / Cal.com / Plausible (allpets-backend) -> Postgres 5432,
# MinIO 9000, ClickHouse 8123/9000. Only the backend namespace may reach data.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-backend
  namespace: allpets-database
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: allpets-backend
      ports:
        - { protocol: TCP, port: 5432 }  # Postgres
        - { protocol: TCP, port: 9000 }  # MinIO / ClickHouse native
        - { protocol: TCP, port: 8123 }  # ClickHouse HTTP
